<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Mohamed Aziz Ben Rejeb, Lead Developer">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#0F172A" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <style>
    .bg { fill: #FFFFFF; }
    .card { fill: url(#grid); }
    .frame { fill: none; stroke: #E2E8F0; }
    .name { font: 700 42px 'IBM Plex Sans', 'Segoe UI', Ubuntu, sans-serif; fill: #0F172A; letter-spacing: -0.5px; }
    .prompt { font: 500 19px 'JetBrains Mono', SFMono-Regular, Consolas, monospace; fill: #15803D; }
    .role { font: 500 19px 'JetBrains Mono', SFMono-Regular, Consolas, monospace; fill: #334155; opacity: 0; }
    .meta { font: 400 13px 'JetBrains Mono', SFMono-Regular, Consolas, monospace; fill: #64748B; }
    .r1 { animation: cycle 12s ease-in-out infinite 0s; }
    .r2 { animation: cycle 12s ease-in-out infinite 3s; }
    .r3 { animation: cycle 12s ease-in-out infinite 6s; }
    .r4 { animation: cycle 12s ease-in-out infinite 9s; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(6px); }
      4%, 21% { opacity: 1; transform: translateY(0); }
      25%, 100% { opacity: 0; transform: translateY(-6px); }
    }
    .rule { stroke: #16A34A; stroke-width: 2; stroke-dasharray: 380; stroke-dashoffset: 380; animation: draw 1.2s ease-out 0.2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .edge { stroke: #CBD5E1; stroke-width: 1.5; fill: none; }
    .packet { fill: #15803D; }
    .node { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 1.5; }
    .node.core { stroke: #16A34A; }
    @media (prefers-reduced-motion: reduce) {
      .role, .rule, .packet { animation: none !important; }
      .rule { stroke-dashoffset: 0; }
      .role { opacity: 0; } .r1 { opacity: 1; }
      .packet { display: none; }
    }
  </style>

  <rect class="bg" width="900" height="210" rx="12"/>
  <rect class="card" width="900" height="210" rx="12"/>
  <rect class="frame" x="0.5" y="0.5" width="899" height="209" rx="11.5"/>

  <text x="48" y="58" class="meta">~/mohamedaziz</text>
  <text x="48" y="108" class="name">Mohamed Aziz Ben Rejeb</text>
  <line x1="48" y1="126" x2="428" y2="126" class="rule"/>

  <text x="48" y="166" class="prompt">$</text>
  <g transform="translate(72 166)">
    <text class="role r1">lead developer</text>
    <text class="role r2">platform foundations &amp; hard features</text>
    <text class="role r3">distributed systems, security first</text>
    <text class="role r4">from product request to production</text>
  </g>

  <!-- service graph: a request travels gateway, api, broker, workers -->
  <g transform="translate(610 45)">
    <path id="p1" class="edge" d="M20 60 H110"/>
    <path id="p2" class="edge" d="M110 60 L200 20"/>
    <path id="p3" class="edge" d="M110 60 L200 100"/>
    <path id="p4" class="edge" d="M200 20 L250 60 L200 100"/>
    <circle class="packet" r="3.5"><animateMotion dur="3s" repeatCount="indefinite" path="M20 60 H110 L200 20 L250 60"/></circle>
    <circle class="packet" r="3.5"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M20 60 H110 L200 100 L250 60"/></circle>
    <circle class="node" cx="20" cy="60" r="11"/>
    <circle class="node core" cx="110" cy="60" r="14"/>
    <circle class="node" cx="200" cy="20" r="11"/>
    <circle class="node" cx="200" cy="100" r="11"/>
    <circle class="node" cx="250" cy="60" r="11"/>
  </g>
</svg>
