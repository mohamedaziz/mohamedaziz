<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="$ exit, logout, connection to prod closed">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D0D0D" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#0D0D0D" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0D0D0D" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.28"/>
    </pattern>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Menlo, Consolas, monospace; white-space: pre; }
    .rain { font-size: 14px; fill: #00FF41; writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 2px; }
    .col { animation: fall linear infinite; opacity: 0.35; }
    @keyframes fall { from { transform: translateY(-260px); } to { transform: translateY(260px); } }
    .t { font-size: 15px; }
    .p { fill: #FF00FF; } .c { fill: #E5E7EB; } .o { fill: #00FF41; } .d { fill: #6B7280; }
    .row { opacity: 0; animation: in 0.01s linear forwards; }
    @keyframes in { to { opacity: 1; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .col { animation: none; opacity: 0.15; }
      .row { animation: none; opacity: 1; }
      .cursor { animation: none; }
    }
  </style>

  <rect width="900" height="210" rx="10" fill="#0D0D0D"/>

  <g class="rain">
    <text x="20" y="0" class="col" style="animation-duration:6s;animation-delay:-1s">01ア1イ0ウ10エ</text>
    <text x="70" y="0" class="col" style="animation-duration:8s;animation-delay:-5s">カ0キ1ク01ケ0コ</text>
    <text x="120" y="0" class="col" style="animation-duration:5s;animation-delay:-2s">1サ0シ1ス0セ1ソ</text>
    <text x="170" y="0" class="col" style="animation-duration:7s;animation-delay:-6s">タ10チツ0テ1ト0</text>
    <text x="220" y="0" class="col" style="animation-duration:9s;animation-delay:-3s">0ナ1ニ0ヌ1ネノ1</text>
    <text x="270" y="0" class="col" style="animation-duration:6.5s;animation-delay:-4s">ハ0ヒ1フ0ヘ1ホ0</text>
    <text x="320" y="0" class="col" style="animation-duration:5.5s;animation-delay:-1.5s">1マ0ミ1ム0メ1モ</text>
    <text x="370" y="0" class="col" style="animation-duration:8.5s;animation-delay:-7s">ヤ1ユ0ヨ10ラ1リ</text>
    <text x="420" y="0" class="col" style="animation-duration:7.5s;animation-delay:-2.5s">0ル1レ0ロ1ワ0ン</text>
    <text x="470" y="0" class="col" style="animation-duration:6s;animation-delay:-3.5s">1ア0カ1サ0タ1ナ</text>
    <text x="520" y="0" class="col" style="animation-duration:9.5s;animation-delay:-6.5s">ハ1マ0ヤ1ラ0ワ1</text>
    <text x="570" y="0" class="col" style="animation-duration:5s;animation-delay:-0.5s">0イ1キ0シ1チ0ニ</text>
    <text x="620" y="0" class="col" style="animation-duration:7s;animation-delay:-4.5s">ヒ0ミ1リ0ウ1ク0</text>
    <text x="670" y="0" class="col" style="animation-duration:8s;animation-delay:-2s">1ス0ツ1ヌ0フ1ム</text>
    <text x="720" y="0" class="col" style="animation-duration:6s;animation-delay:-5.5s">ユ0ル1エ0ケ1セ0</text>
    <text x="770" y="0" class="col" style="animation-duration:5.5s;animation-delay:-3s">1テ0ネ1ヘ0メ1レ</text>
    <text x="820" y="0" class="col" style="animation-duration:8.5s;animation-delay:-1s">オ1コ0ソ1ト0ノ1</text>
    <text x="870" y="0" class="col" style="animation-duration:7s;animation-delay:-6s">0ホ1モ0ヨ1ロ0ン</text>
  </g>
  <rect width="900" height="210" fill="url(#fade)"/>

  <g transform="translate(300 70)">
    <rect x="-20" y="-24" width="340" height="112" rx="6" fill="#0D0D0D" fill-opacity="0.85" stroke="#1F2937"/>
    <text x="0" y="0" class="t"><tspan class="p">$ </tspan><tspan class="c">exit</tspan></text>
    <text x="0" y="24" class="t d row" style="animation-delay:.8s">logout</text>
    <text x="0" y="48" class="t d row" style="animation-delay:1.2s">Connection to prod closed.</text>
    <g class="row" style="animation-delay:1.6s">
      <text x="0" y="72" class="t o">thanks for reading the logs</text>
      <rect x="252" y="60" width="9" height="15" fill="#00FF41" class="cursor"/>
    </g>
  </g>

  <rect width="900" height="210" rx="10" fill="url(#scan)" pointer-events="none"/>
  <rect x="0.5" y="0.5" width="899" height="209" rx="9.5" fill="none" stroke="#1F2937"/>
</svg>
