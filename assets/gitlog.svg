<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Career as git log: 2013 ISET CH BSc, 2016 ESPRIT MEng, 2016 Atayen full-stack, 2014 to 2022 freelance branch, 2019 Haydar lead developer, 2023 Hubency lead developer">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.28"/>
    </pattern>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Menlo, Consolas, monospace; white-space: pre; font-size: 13px; }
    .p { fill: #FF00FF; } .c { fill: #E5E7EB; } .o { fill: #00FF41; } .d { fill: #6B7280; } .y { fill: #00FFFF; } .h { fill: #FFBD2E; } .r { fill: #FF5F56; }
    .title { font-size: 12px; fill: #9CA3AF; }
    .main { stroke: #00FF41; stroke-width: 2.5; fill: none; stroke-dasharray: 240; stroke-dashoffset: 240; animation: draw 2.4s linear 0.3s forwards; }
    .side { stroke: #FF00FF; stroke-width: 2.5; fill: none; stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw 1.2s linear 0.9s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .dot { fill: #0D0D0D; stroke-width: 2.5; }
    .dot.m { stroke: #00FF41; } .dot.f { stroke: #FF00FF; }
    .dot.head { fill: #00FF41; animation: pulse 1.6s ease-in-out 2.8s infinite; }
    @keyframes pulse { 50% { r: 9; } }
    .row { opacity: 0; animation: in 0.3s ease-out forwards; }
    @keyframes in { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .main, .side { animation: none; stroke-dashoffset: 0; }
      .row { animation: none; opacity: 1; }
      .dot.head { animation: none; }
    }
  </style>

  <rect width="900" height="340" rx="10" fill="#0D0D0D"/>
  <rect width="900" height="32" rx="10" fill="#161B22"/>
  <rect y="22" width="900" height="10" fill="#161B22"/>
  <circle cx="22" cy="16" r="6" fill="#FF5F56"/>
  <circle cx="42" cy="16" r="6" fill="#FFBD2E"/>
  <circle cx="62" cy="16" r="6" fill="#27C93F"/>
  <text x="450" y="20" text-anchor="middle" class="title">aziz@prod: ~/career (main)</text>

  <text x="32" y="62"><tspan class="p">$ </tspan><tspan class="c">git log --graph --oneline career</tspan></text>

  <!-- graph: main line bottom to top, freelance branch from 2013 to its 2022 merge -->
  <path class="main" d="M50 304 V90"/>
  <path class="side" d="M50 304 C50 290 76 290 76 276 V158 C76 144 50 144 50 124"/>

  <circle class="dot m" cx="50" cy="304" r="6"/>
  <circle class="dot m" cx="50" cy="270" r="6"/>
  <circle class="dot m" cx="50" cy="236" r="6"/>
  <circle class="dot f" cx="76" cy="202" r="6"/>
  <circle class="dot m" cx="50" cy="168" r="6"/>
  <circle class="dot m" cx="50" cy="124" r="6"/>
  <circle class="dot m head" cx="50" cy="90" r="6"/>

  <g transform="translate(104 0)">
    <text x="0" y="308" class="row" style="animation-delay:.3s"><tspan class="h">0000001 </tspan><tspan class="d">2013  </tspan><tspan class="c">init(iset): BSc, computer systems development</tspan></text>
    <text x="0" y="274" class="row" style="animation-delay:.7s"><tspan class="h">4e7a6d3 </tspan><tspan class="d">2016  </tspan><tspan class="c">build(esprit): computer engineering, MEng</tspan></text>
    <text x="0" y="240" class="row" style="animation-delay:1.1s"><tspan class="h">91fe2b0 </tspan><tspan class="d">2016  </tspan><tspan class="c">feat(atayen): full-stack dev, crypto wallet, trading platform, CRM</tspan></text>
    <text x="0" y="206" class="row" style="animation-delay:1.4s"><tspan class="h">c09ab37 </tspan><tspan class="p">(freelance) </tspan><tspan class="d">2014  </tspan><tspan class="c">feat: consulting, SRS, integrations, Symfony apps</tspan></text>
    <text x="0" y="172" class="row" style="animation-delay:1.8s"><tspan class="h">5d21e8a </tspan><tspan class="y">(tag: lead) </tspan><tspan class="d">2019  </tspan><tspan class="c">feat(haydar): lead dev, TAIPAN, ADAPA, team of ten</tspan></text>
    <text x="0" y="128" class="row" style="animation-delay:2.2s"><tspan class="h">7be0d14 </tspan><tspan class="d">2022  </tspan><tspan class="c">merge branch 'freelance' </tspan><tspan class="d">(8 years of side missions)</tspan></text>
    <text x="0" y="94" class="row" style="animation-delay:2.6s"><tspan class="h">a3f9c21 </tspan><tspan class="o">(HEAD -&gt; main) </tspan><tspan class="d">2023  </tspan><tspan class="c">feat(hubency): lead dev, ERP from microservices to monorepo</tspan></text>
  </g>

  <rect width="900" height="340" rx="10" fill="url(#scan)" pointer-events="none"/>
  <rect x="0.5" y="0.5" width="899" height="339" rx="9.5" fill="none" stroke="#1F2937"/>
</svg>
