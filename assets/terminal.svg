<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="Terminal: ssh aziz@prod, banner AZIZ, whoami: Mohamed Aziz Ben Rejeb, Lead Developer">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.28"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Menlo, Consolas, monospace; white-space: pre; }
    .t { font-size: 15px; }
    .p { fill: #FF00FF; }
    .c { fill: #E5E7EB; }
    .o { fill: #00FF41; }
    .d { fill: #6B7280; }
    .y { fill: #00FFFF; }
    .art { font-size: 19px; fill: #00FF41; }
    .title { font-size: 12px; fill: #9CA3AF; }
    .cover { fill: #0D0D0D; }
    .show { opacity: 0; animation: show 0.01s linear forwards; }
    @keyframes show { to { opacity: 1; } }
    .type1 { animation: type1 0.7s steps(15) 0.3s forwards; }
    .type2 { animation: type2 0.7s steps(16) 1.8s forwards; }
    .type3 { animation: type3 0.4s steps(8) 3.4s forwards; }
    @keyframes type1 { to { transform: translateX(140px); } }
    @keyframes type2 { to { transform: translateX(150px); } }
    @keyframes type3 { to { transform: translateX(75px); } }
    .glitch { opacity: 0; animation: glitch 7s steps(1) 4.5s infinite; }
    .glitch.m { fill: #FF00FF; }
    .glitch.cy { fill: #00FFFF; }
    @keyframes glitch {
      0% { opacity: 0.7; transform: translate(-3px, 0); }
      2% { opacity: 0.7; transform: translate(3px, -1px); }
      4%, 100% { opacity: 0; transform: none; }
    }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .edge { stroke: #00FFFF; stroke-opacity: 0.35; stroke-width: 1.2; fill: none; }
    .node { fill: #0D0D0D; stroke: #00FFFF; stroke-width: 1.4; }
    .node.hot { stroke: #FF00FF; }
    .pk { fill: #00FF41; }
    .lbl { font-size: 10px; fill: #6B7280; }
    @media (prefers-reduced-motion: reduce) {
      .show { animation: none; opacity: 1; }
      .cover, .glitch, .pk { display: none; }
      .cursor { animation: none; }
    }
  </style>

  <!-- window -->
  <rect width="900" height="380" rx="10" fill="#0D0D0D"/>
  <rect width="900" height="32" rx="10" fill="#161B22"/>
  <rect y="22" width="900" height="10" fill="#161B22"/>
  <circle cx="22" cy="16" r="6" fill="#FF5F56"/>
  <circle cx="42" cy="16" r="6" fill="#FFBD2E"/>
  <circle cx="62" cy="16" r="6" fill="#27C93F"/>
  <text x="450" y="20" text-anchor="middle" class="title">aziz@prod: ~ (zsh not found, bash it is)</text>

  <!-- 1. ssh -->
  <text x="32" y="64" class="t"><tspan class="p">$ </tspan><tspan class="c">ssh aziz@prod</tspan></text>
  <rect x="32" y="49" width="160" height="22" class="cover type1"/>
  <text x="32" y="88" class="t show" style="animation-delay:1.1s"><tspan class="o">✔ </tspan><tspan class="d">connected · welcome back, lead</tspan></text>

  <!-- 2. banner -->
  <text x="32" y="120" class="t"><tspan class="p">$ </tspan><tspan class="c">cat banner.txt</tspan></text>
  <rect x="32" y="105" width="170" height="22" class="cover type2"/>

  <g class="show" style="animation-delay:2.6s">
    <g id="art" class="art" filter="url(#glow)">
      <text x="32" y="152"> █████╗ ███████╗██╗███████╗</text>
      <text x="32" y="174">██╔══██╗╚══███╔╝██║╚══███╔╝</text>
      <text x="32" y="196">███████║  ███╔╝ ██║  ███╔╝ </text>
      <text x="32" y="218">██╔══██║ ███╔╝  ██║ ███╔╝  </text>
      <text x="32" y="240">██║  ██║███████╗██║███████╗</text>
      <text x="32" y="262">╚═╝  ╚═╝╚══════╝╚═╝╚══════╝</text>
    </g>
    <use xlink:href="#art" href="#art" class="glitch m"/>
    <use xlink:href="#art" href="#art" class="glitch cy" style="animation-delay:4.55s"/>
  </g>

  <!-- 3. whoami -->
  <text x="32" y="298" class="t"><tspan class="p">$ </tspan><tspan class="c">whoami</tspan></text>
  <rect x="32" y="283" width="90" height="22" class="cover type3"/>
  <text x="32" y="322" class="t show" style="animation-delay:4s"><tspan class="o">Mohamed Aziz Ben Rejeb</tspan><tspan class="d"> · </tspan><tspan class="y">Lead Developer</tspan><tspan class="d"> · platform, distributed systems, security</tspan></text>

  <!-- prompt -->
  <g class="show" style="animation-delay:4.3s">
    <text x="32" y="354" class="t p">$ </text>
    <rect x="52" y="341" width="9" height="16" fill="#00FF41" class="cursor"/>
  </g>

  <!-- service mesh: gateway, api, broker, workers -->
  <g transform="translate(560 120)" class="show" style="animation-delay:2.6s">
    <path class="edge" d="M20 80 H110 L200 30 L280 80 L200 130 L110 80"/>
    <path class="edge" d="M200 30 V130"/>
    <circle class="pk" r="3.5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M20 80 H110 L200 30 L280 80"/></circle>
    <circle class="pk" r="3.5"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M20 80 H110 L200 130 L280 80"/></circle>
    <circle class="node" cx="20" cy="80" r="10"/>
    <circle class="node hot" cx="110" cy="80" r="14"/>
    <circle class="node" cx="200" cy="30" r="10"/>
    <circle class="node" cx="200" cy="130" r="10"/>
    <circle class="node" cx="280" cy="80" r="10"/>
    <text x="20" y="108" text-anchor="middle" class="lbl">gateway</text>
    <text x="110" y="112" text-anchor="middle" class="lbl">api</text>
    <text x="200" y="12" text-anchor="middle" class="lbl">broker</text>
    <text x="200" y="158" text-anchor="middle" class="lbl">workers</text>
    <text x="280" y="108" text-anchor="middle" class="lbl">db</text>
  </g>

  <rect width="900" height="380" rx="10" fill="url(#scan)" pointer-events="none"/>
  <rect width="900" height="380" rx="10" fill="url(#vignette)" pointer-events="none"/>
  <rect x="0.5" y="0.5" width="899" height="379" rx="9.5" fill="none" stroke="#1F2937"/>
</svg>
