<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-label="neofetch: Lead Developer at Hubency, Ile-de-France, TypeScript, Node.js, Python, Go, microservices, RabbitMQ, MongoDB, Kubernetes, security">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.28"/>
    </pattern>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Menlo, Consolas, monospace; white-space: pre; font-size: 14px; }
    .p { fill: #FF00FF; } .c { fill: #E5E7EB; } .o { fill: #00FF41; } .d { fill: #6B7280; } .y { fill: #00FFFF; }
    .tux { font-size: 17px; fill: #00FFFF; }
    .k { fill: #00FFFF; font-weight: 700; }
    .v { fill: #E5E7EB; }
    .title { font-size: 12px; fill: #9CA3AF; }
    .row { opacity: 0; animation: in 0.25s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    .eyes { animation: blinkeyes 5s steps(1) infinite; }
    @keyframes blinkeyes { 0%, 94% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .row { animation: none; opacity: 1; }
      .eyes { animation: none; }
    }
  </style>

  <rect width="900" height="370" rx="10" fill="#0D0D0D"/>
  <rect width="900" height="32" rx="10" fill="#161B22"/>
  <rect y="22" width="900" height="10" fill="#161B22"/>
  <circle cx="22" cy="16" r="6" fill="#FF5F56"/>
  <circle cx="42" cy="16" r="6" fill="#FFBD2E"/>
  <circle cx="62" cy="16" r="6" fill="#27C93F"/>
  <text x="450" y="20" text-anchor="middle" class="title">aziz@prod: ~ neofetch</text>

  <text x="32" y="62"><tspan class="p">$ </tspan><tspan class="c">neofetch</tspan></text>

  <g class="tux" filter="url(#glow)">
    <text x="48" y="120">       .--.</text>
    <text x="48" y="142">      |<tspan class="eyes">o_o</tspan> |</text>
    <text x="48" y="164">      |:_/ |</text>
    <text x="48" y="186">     //   \ \</text>
    <text x="48" y="208">    (|     | )</text>
    <text x="48" y="230">   /'\_   _/`\</text>
    <text x="48" y="252">   \___)=(___/</text>
  </g>

  <g transform="translate(300 0)">
    <text x="0" y="98" class="row" style="animation-delay:.1s"><tspan class="o">aziz</tspan><tspan class="c">@</tspan><tspan class="o">lead-dev</tspan></text>
    <text x="0" y="116" class="row d" style="animation-delay:.15s">─────────────</text>
    <text x="0" y="140" class="row" style="animation-delay:.2s"><tspan class="k">OS       </tspan><tspan class="v"> Lead Developer @ Hubency</tspan></text>
    <text x="0" y="162" class="row" style="animation-delay:.3s"><tspan class="k">Host     </tspan><tspan class="v"> Île-de-France, France</tspan></text>
    <text x="0" y="184" class="row" style="animation-delay:.4s"><tspan class="k">Uptime   </tspan><tspan class="v"> 10+ years (full-time since 2016)</tspan></text>
    <text x="0" y="206" class="row" style="animation-delay:.5s"><tspan class="k">Kernel   </tspan><tspan class="v"> TypeScript · Node.js · Python · Go</tspan></text>
    <text x="0" y="228" class="row" style="animation-delay:.6s"><tspan class="k">Packages </tspan><tspan class="v"> microservices · RabbitMQ · MongoDB · Redis · Keycloak</tspan></text>
    <text x="0" y="250" class="row" style="animation-delay:.7s"><tspan class="k">DE       </tspan><tspan class="v"> Vue 3 · Quasar · React</tspan></text>
    <text x="0" y="272" class="row" style="animation-delay:.8s"><tspan class="k">WM       </tspan><tspan class="v"> Docker · Kubernetes · GitLab CI · Terraform</tspan></text>
    <text x="0" y="294" class="row" style="animation-delay:.9s"><tspan class="k">Security </tspan><tspan class="v"> pentest · code audit · hardening</tspan></text>
    <text x="0" y="316" class="row" style="animation-delay:1s"><tspan class="k">Mode     </tspan><tspan class="v"> foundations · hard features · tech decisions</tspan></text>
    <text x="0" y="338" class="row" style="animation-delay:1.1s"><tspan class="k">Locale   </tspan><tspan class="v"> ar · fr · en</tspan></text>
    <g transform="translate(470 84)"><g class="row" style="animation-delay:1.2s">
      <rect x="0" y="0" width="22" height="14" fill="#1F2937"/>
      <rect x="24" y="0" width="22" height="14" fill="#FF5F56"/>
      <rect x="48" y="0" width="22" height="14" fill="#00FF41"/>
      <rect x="72" y="0" width="22" height="14" fill="#FFBD2E"/>
      <rect x="0" y="16" width="22" height="14" fill="#3B82F6"/>
      <rect x="24" y="16" width="22" height="14" fill="#FF00FF"/>
      <rect x="48" y="16" width="22" height="14" fill="#00FFFF"/>
      <rect x="72" y="16" width="22" height="14" fill="#E5E7EB"/>
    </g></g>
  </g>

  <rect width="900" height="370" rx="10" fill="url(#scan)" pointer-events="none"/>
  <rect x="0.5" y="0.5" width="899" height="369" rx="9.5" fill="none" stroke="#1F2937"/>
</svg>
