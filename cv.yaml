    summary:
      - >-
        Lead developer who owns the hard parts: platform foundations, critical features and the technical
        decisions that shape a product. Designs and ships distributed systems end to end (microservices,
        message-driven workflows, auth, CI/CD, Kubernetes on bare metal) with security built in from the
        first line. Bridges product and engineering: turns business requests into feasible, sized plans,
