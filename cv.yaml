    experience:
      - company: Hubency
        position: Lead Developer
        start_date: 2023
        end_date: present
        summary: Waste-management services integrator. Technical lead of the in-house ERP.
        highlights:
          - Lead the company's ERP, a **TypeScript/Node.js microservices monorepo** (REST API, client extranet API, gateway, auth service, workers) with two Vue 3/Quasar front-ends.
          - Co-designed the initial **microservices architecture** (API, auth, orchestrator, mailer, PDF and notification services) and co-led its **consolidation into a monorepo**, and provisioned the AWS infrastructure with Terraform.
          - Own the **platform foundations**, including shared schema, DTO and contract libraries, RabbitMQ workflow orchestration (PDF, mail and crawler workers with dead-letter queues), MongoDB migrations and Keycloak-based authentication.
          - Take on the **hardest features end to end**, such as pricing resolution, order and intervention lifecycles, and billing flows.
          - Make the **architecture and technical decisions**, and partner with Product Owners to assess feasibility, size requests and shape specifications before build.
          - **Arbitrate production urgencies** against the roadmap and keep delivery on track.
          - **Coordinate external contractors** on ongoing projects, covering scoping, code review and delivery quality.
          - Top contributor to the codebase (**969 of 1,743 non-merge commits, ~56%**), and drive **AI-assisted engineering** (Claude Code agents, automated review and specification workflows).
          - '*Stack:* TypeScript, Node.js, Express, MongoDB/Mongoose, Redis, RabbitMQ, Keycloak, AWS S3, Vue 3, Quasar, Turborepo, Jest, Docker, GitLab CI.'

      - company: Haydar Technologies
        position: Lead Developer
        start_date: 2019
        end_date: 2023
        highlights:
          - Led a **team of ten engineers** in Scrum; split work, assigned tasks, ran code reviews and mentored engineers on their career paths.
          - "**TAIPAN**, a plug-and-play pentest appliance: designed the whole infrastructure, built the Flask core, the attack engines and the licence back office, ran GitLab CI/CD and Harbor on bare metal, and owned an outsourced version migration from specifications to acceptance."
          - "**ADAPA**, an AI reputation-scoring platform: wrote the SRS and designed the microservices, broker and workers architecture. Built the task orchestrator, a Python RabbitMQ library, Keycloak and Kong auth, and a bare-metal Kubernetes cluster."
          - "**Volkswagen d3 GUI**, data distribution to connected vehicles: designed the microservices architecture, built the full GraphQL API and the React foundations, secured server-to-server auth over ZeroMQ and the Kubernetes clusters, and rewrote a reverse-engineered module in Go."
          - "Also delivered an end-to-end encrypted chat prototype (React Native, Socket.IO) and the tender response and design of a smart-meter pay-as-you-go platform."
          - '*Stack:* Python, JavaScript, Go, Shell, Flask, Node.js, React, GraphQL, MongoDB, PostgreSQL, Redis, RabbitMQ, Keycloak, Kong, Docker, Kubernetes, Harbor, Terraform, Ansible, Grafana, Prometheus, Metasploit, Nuclei, SQLMap.'

      - company: Atayen
        position: Full-Stack Developer
        start_date: 2016
        end_date: 2019
        highlights:
          - Coordinated a team of ten with direct client contact; split work and assigned tasks.
          - "**SaTT-Token wallet**: designed the solution and its infrastructure; built the full REST API (Symfony, Node.js) and the core features (accounts, wallets, contacts, referral, SaTT/BTC transfers)."
          - "**3xchange** crypto trading platform: built authentication, MetaMask integration and exchange on the 0x protocol with web3.js, plus the client and transaction back office."
          - "**Iframe-apps** social CRM: stabilised the legacy system, built a mail worker sending ~10K emails/hour, email tracking and Elasticsearch search, and hardened the servers against injection, brute force and DDoS."
          - '*Stack:* PHP, JavaScript, Solidity, Symfony, Node.js, AngularJS, MongoDB, MySQL, Elasticsearch, Web3.'

      - company: Freelance
        position: Technical Consultant & Developer
        start_date: 2014
        end_date: 2022
        highlights:
          - "**Boxstage**: technical consultant; wrote the SRS, set up the infrastructure, supported the POC, and tested and fixed the GDPR-compliance app Bureau-rgpd (including a subcontracting-processing feature)."
          - "**Soomville** jobbing platform: HTML/CSS integration and every web interface in AngularJS; Laravel API fixes."
          - "**Continental Tours**: designed and built a case-management app for a travel agency covering requests, finance, statistics and archives (Symfony 4)."
          - "**Wanderer Guide**: low-cost hiking-travel platform with advanced search, bookings, payments and reviews (Symfony 3); started as the engineering final-year project at One Solution."

