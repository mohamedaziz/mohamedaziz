      - name: Lead-tech agentic system (private, in progress)
        summary: Self-hosted multi-agent system that takes over a tech lead's operational work (tickets, merge requests, time tracking, mail), steered from a phone by text or voice. Model-agnostic through LiteLLM, traced and evaluated with Langfuse, built on Hermes Agent. All data stays local.
      - name: Claude Code toolkit (private, in progress)
        summary: Catalog of skills, agents and plugins with a gatekeeper (spec writing, review and delivery workflows), including a plugin that designs and verifies 3D-printable parts.

